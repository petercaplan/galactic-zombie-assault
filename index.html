<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Galactic Zombie Assault</title>
<link rel="stylesheet" href="style.css?v=20260920c" />
</head>
<body>

<div id="stage">
  <canvas id="game"></canvas>

  <!-- HUD -->
  <div id="hud">
    <div id="hud-left">
      <div id="lives"></div>
      <div id="shield-wrap"><div id="shield-bar"></div></div>
      <div id="combo-display"></div>
    </div>
    <div id="hud-right">
      <div id="score">SCORE 0</div>
      <div id="highscore">BEST 0</div>
    </div>
    <div id="planet-name"></div>
  </div>

  <button id="mute-btn" aria-label="Toggle sound">🔊</button>

  <!-- Boss health bar -->
  <div id="boss-bar-wrap" class="hidden">
    <div id="boss-name"></div>
    <div id="boss-health-outer"><div id="boss-health-fill"></div></div>
  </div>

  <!-- Start screen -->
  <div class="screen" id="screen-start">
    <h1 class="title">GALACTIC<br>ZOMBIE ASSAULT</h1>
    <p class="subtitle">they came from the dirt.<br>now they've got rockets<br>&amp; they don't die easy.</p>
    <button class="btn" id="btn-start">START</button>
    <button class="btn btn-ghost" id="btn-leaderboard">🏆 LEADERBOARD</button>
    <div class="howto">
      <div class="howto-row"><span class="key">◀ ▶</span> move &nbsp;·&nbsp; <span class="key">SPACE</span> shoot &nbsp;·&nbsp; <span class="key">P</span> pause</div>
      <div class="howto-row touch-only">or drag the pad bottom-left to move &nbsp;·&nbsp; tap FIRE bottom-right</div>
    </div>
  </div>

  <!-- Leaderboard screen -->
  <div class="screen hidden" id="screen-leaderboard">
    <h2 class="title small">🏆 LEADERBOARD</h2>
    <div id="leaderboard-list"><div class="leaderboard-status">Loading…</div></div>
    <button class="btn" id="btn-leaderboard-back">BACK</button>
  </div>

  <!-- Pause screen -->
  <div class="screen hidden" id="screen-pause">
    <h2 class="title small">PAUSED</h2>
    <button class="btn" id="btn-resume">RESUME</button>
  </div>

  <!-- Level clear screen -->
  <div class="screen hidden" id="screen-levelclear">
    <h2 class="title small" id="levelclear-title">PLANET SECURED</h2>
    <div id="levelclear-grade"></div>
    <div id="levelclear-tally"></div>
    <p class="subtitle" id="levelclear-next"></p>
    <button class="btn" id="btn-continue">CONTINUE</button>
  </div>

  <!-- Upgrade choice screen -->
  <div class="screen hidden" id="screen-upgrade">
    <h2 class="title small">CHOOSE YOUR UPGRADE</h2>
    <div id="upgrade-cards"></div>
  </div>

  <!-- Game over screen -->
  <div class="screen hidden" id="screen-gameover">
    <h2 class="title small red">OVERRUN</h2>
    <p class="subtitle" id="gameover-wave"></p>
    <p class="subtitle" id="gameover-score"></p>
    <div id="score-submit-row">
      <input type="text" id="input-name" maxlength="12" placeholder="YOUR NAME" autocomplete="off" />
      <button class="btn btn-secondary" id="btn-submit-score">SUBMIT SCORE</button>
    </div>
    <div id="submit-status"></div>
    <button class="btn" id="btn-restart">TRY AGAIN</button>
  </div>

  <!-- Touch controls: a dedicated drag pad bottom-left (mirrors FIRE bottom-right)
       so your thumb never has to rest over the play field to steer. -->
  <div id="touch-controls">
    <button id="touch-move-zone" class="touch-btn touch-movezone" aria-label="Move">✥</button>
    <button id="btn-fire" class="touch-btn touch-fire" aria-label="Fire">FIRE</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="game.js?v=20260920c"></script>
</body>
</html>
